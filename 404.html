<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | NARI Health</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --ink-black: #05090F;
            --carmine: #C5172E;
            --lavender-blush: #F4E4E4;
            --white: #FFFFFF;
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Lato', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            color: var(--ink-black);
            background-color: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        header {
            padding: 22px 40px;
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .brand img { height: 44px; width: auto; }

        .brand-title {
            font-family: var(--font-serif);
            font-weight: 700;
            font-size: 1rem;
            color: var(--ink-black);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 24px;
            background: linear-gradient(135deg, var(--lavender-blush) 0%, #fff 60%);
        }

        .error-wrap {
            text-align: center;
            max-width: 540px;
        }

        .error-num {
            font-family: var(--font-serif);
            font-size: 8rem;
            font-weight: 700;
            color: var(--carmine);
            line-height: 1;
            opacity: 0.15;
            margin-bottom: -20px;
        }

        .error-icon {
            font-size: 3.5rem;
            color: var(--carmine);
            margin-bottom: 24px;
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 2rem;
            margin-bottom: 16px;
            color: var(--ink-black);
        }

        p {
            color: #666;
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 36px;
        }

        .btn-group {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            background-color: var(--carmine);
            color: var(--white);
            border-radius: 50px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.82rem;
            text-decoration: none;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            border: 2px solid var(--carmine);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(197,23,46,0.25);
        }

        .btn-outline {
            background: transparent;
            color: var(--ink-black);
            border-color: var(--ink-black);
        }

        .btn-outline:hover {
            background: var(--ink-black);
            color: var(--white);
        }

        footer {
            padding: 20px 40px;
            text-align: center;
            font-size: 0.82rem;
            color: #999;
            border-top: 1px solid rgba(0,0,0,0.06);
        }

        @media (max-width: 480px) {
            .error-num { font-size: 5rem; }
            h1 { font-size: 1.6rem; }
            .btn-group { flex-direction: column; align-items: center; }
            header { padding: 18px 20px; }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="brand">
            <img src="./assets/last.png" alt="NARI Logo">
            <span class="brand-title">NARI Health</span>
        </a>
    </header>

    <main>
        <div class="error-wrap">
            <div class="error-num">404</div>
            <div class="error-icon">
                <i class="fa-solid fa-heart-crack"></i>
            </div>
            <h1>Page Not Found</h1>
            <p>The page you are looking for doesn't exist or has been moved. Let's get you back on your healing journey.</p>
            <div class="btn-group">
                <a href="index.html" class="btn">Go Back Home</a>
                <a href="index.html#contact" class="btn btn-outline">Contact Us</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 NARI Wellness. All Rights Reserved.</p>
    </footer>
</body>
</html>
